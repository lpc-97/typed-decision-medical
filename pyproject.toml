[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tdm"
version = "0.1.0"
description = "Typed decision readouts for medical vision-language models (paper code)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
